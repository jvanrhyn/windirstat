[package]
name = "windirstats2"
version = "0.1.0"
edition = "2021"
authors = ["WinDirStat Team"]
description = "A cross-platform disk usage analyzer with treemap visualization"
license = "GPL-2.0"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_extras = "0.29"
walkdir = "2.5"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
anyhow = "1.0"
thiserror = "1.0"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
